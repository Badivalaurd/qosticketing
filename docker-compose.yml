version: '3.9'
name: ittis

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "keycloak.adcm.orangecm:172.26.76.96"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py init_prod &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --worker-tmp-dir /tmp"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    volumes:
      - media_data:/app/media
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/accounts/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery:
    build: .
    restart: unless-stopped
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      - redis

volumes:
  media_data:
