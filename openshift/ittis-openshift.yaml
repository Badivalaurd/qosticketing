apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ittis-media
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: crc-csi-hostpath-provisioner
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ittis-redis
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ittis-redis
  template:
    metadata:
      labels:
        app: ittis-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ittis-redis
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: redis
spec:
  selector:
    app: ittis-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ittis-web
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ittis-web
  template:
    metadata:
      labels:
        app: ittis-web
    spec:
      initContainers:
        - name: migrate
          image: ittis-web:latest
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              python manage.py migrate --noinput &&
              python manage.py init_prod
          envFrom:
            - configMapRef:
                name: ittis-config
            - secretRef:
                name: ittis-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      containers:
        - name: web
          image: ittis-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ittis-config
            - secretRef:
                name: ittis-secret
          volumeMounts:
            - name: media
              mountPath: /app/media
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: ittis-media
---
apiVersion: v1
kind: Service
metadata:
  name: ittis-web
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: web
spec:
  selector:
    app: ittis-web
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ittis-celery
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ittis-celery
  template:
    metadata:
      labels:
        app: ittis-celery
    spec:
      containers:
        - name: celery
          image: ittis-web:latest
          imagePullPolicy: Never
          command:
            - celery
            - -A
            - config.celery
            - worker
            - --loglevel=info
            - --concurrency=2
            - -E
          envFrom:
            - configMapRef:
                name: ittis-config
            - secretRef:
                name: ittis-secret
          volumeMounts:
            - name: media
              mountPath: /app/media
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: ittis-media
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ittis-celery-beat
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: celery-beat
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: ittis-celery-beat
        spec:
          restartPolicy: OnFailure
          containers:
            - name: beat
              image: ittis-web:latest
              imagePullPolicy: Never
              command:
                - celery
                - -A
                - config.celery
                - beat
                - --loglevel=info
                - --scheduler
                - django_celery_beat.schedulers:DatabaseScheduler
              envFrom:
                - configMapRef:
                    name: ittis-config
                - secretRef:
                    name: ittis-secret
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ittis
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: route
spec:
  to:
    kind: Service
    name: ittis-web
    weight: 100
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
