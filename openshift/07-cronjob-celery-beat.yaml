# ══════════════════════════════════════════════════════════════════════════════
# CronJob — Celery Beat (tâches planifiées : SLA, rappels, nettoyage)
# On utilise un CronJob k8s plutôt qu'un pod long-running pour la robustesse.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ittis-celery-beat
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: celery-beat
spec:
  # Déclencher toutes les minutes (beat standard)
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: ittis-celery-beat
        spec:
          restartPolicy: OnFailure
          containers:
            - name: beat
              image: <IMAGE>
              command:
                - celery
                - -A
                - config.celery
                - beat
                - --loglevel=info
                - --scheduler
                - django_celery_beat.schedulers:DatabaseScheduler
              envFrom:
                - configMapRef:
                    name: ittis-config
                - secretRef:
                    name: ittis-secret
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
