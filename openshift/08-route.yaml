# ══════════════════════════════════════════════════════════════════════════════
# Route OpenShift — accès externe HTTPS via edge TLS
# Le hostname par défaut CRC sera : ittis-ittis.apps-crc.testing
# Mettre à jour ALLOWED_HOSTS dans le ConfigMap si vous changez ce hostname.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ittis
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: route
spec:
  # Laisser vide pour utiliser le hostname automatique CRC
  # host: ittis-ittis.apps-crc.testing
  to:
    kind: Service
    name: ittis-web
    weight: 100
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
