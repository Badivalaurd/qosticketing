# ══════════════════════════════════════════════════════════════════════════════
# ConfigMap — configuration non-sensible ITTIS
# Adapter ALLOWED_HOSTS à votre hostname OpenShift Local (oc get route -n ittis)
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: ittis-config
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "ittis-ittis.apps-crc.testing,localhost,127.0.0.1"

  # Base de données MariaDB externe
  DB_ENGINE: "django.db.backends.mysql"
  DB_NAME: "om_ticketing_dev"
  DB_USER: "ZZZZWLKV_omticketdev"
  DB_HOST: "172.26.76.252"
  DB_PORT: "3323"

  # Redis (pod interne)
  REDIS_URL: "redis://ittis-redis:6379/0"
  CELERY_BROKER_URL: "redis://ittis-redis:6379/0"

  # Email — relay SMTP interne Orange (sans auth)
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "172.26.76.151"
  EMAIL_PORT: "25"
  EMAIL_USE_TLS: "False"
  EMAIL_USE_SSL: "False"
  DEFAULT_FROM_EMAIL: "ITTIS <no-reply.extraction@orange.com>"
  NOTIFICATION_EMAIL: "no-reply.extraction@orange.com"

  # Média
  MEDIA_ROOT: "/app/media"
  MEDIA_URL: "/media/"

  # Keycloak / OIDC
  OIDC_KEYCLOAK_URL: "http://keycloak.adcm.orangecm/auth"
  OIDC_KEYCLOAK_REALM: "digital-app"
  OIDC_RP_CLIENT_ID: "qos-ticketing"

  # Admin
  ADMIN_EMAIL: "badivalaurd@gmail.com"
