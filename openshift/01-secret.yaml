# ══════════════════════════════════════════════════════════════════════════════
# Secret — variables sensibles ITTIS
# IMPORTANT : Remplacer les valeurs avant d'appliquer.
# Les valeurs sont encodées en base64 : echo -n "valeur" | base64
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: ittis-secret
  namespace: ittis
  labels:
    app.kubernetes.io/name: ittis
type: Opaque
stringData:
  # Clé secrète Django (générer avec : python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")
  SECRET_KEY: "REMPLACER-PAR-UNE-VRAIE-CLE-SECRETE-LONGUE"

  # Base de données MariaDB externe
  DB_PASSWORD: "2BwJ713gHIB8rkW"

  # Keycloak OIDC
  OIDC_RP_CLIENT_SECRET: "ac58ed16-89cb-418c-8439-c55f608a9ea0"

  # Email (relay interne Orange — pas d'auth)
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
