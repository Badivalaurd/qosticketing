# ── Image ────────────────────────────────────────────────────────────────────
image:
  repository: nexus.orange.cm:5001/ittis-web
  tag: latest
  pullPolicy: Always

# ── Secrets (à modifier avant déploiement) ───────────────────────────────────
secret:
  secretKey: "CHANGE_ME_generate_with_python_secrets_token_hex_50"
  dbPassword: "CHANGE_ME_db_password"
  oidcClientSecret: "CHANGE_ME_keycloak_client_secret"
  emailHostUser: ""
  emailHostPassword: ""
  adminPassword: "CHANGE_ME_admin_password"
  agentPassword: "CHANGE_ME_agent_password"

# ── Configuration ─────────────────────────────────────────────────────────────
config:
  debug: "False"
  allowedHosts: "CHANGE_ME_openshift_route_host,localhost,127.0.0.1"
  dbEngine: "django.db.backends.mysql"
  dbName: "om_ticketing_dev"
  dbUser: "CHANGE_ME_db_user"
  dbHost: "CHANGE_ME_db_host"
  dbPort: "3306"
  redisUrl: "redis://ittis-redis:6379/0"
  celeryBrokerUrl: "redis://ittis-redis:6379/0"
  emailBackend: "django.core.mail.backends.smtp.EmailBackend"
  emailHost: "CHANGE_ME_smtp_host"
  emailPort: "25"
  emailUseTls: "False"
  emailUseSsl: "False"
  defaultFromEmail: "ITTIS <no-reply.extraction@orange.com>"
  notificationEmail: "no-reply.extraction@orange.com"
  oidcKeycloakUrl: "http://keycloak.adcm.orangecm/auth"
  oidcKeycloakRealm: "digital-app"
  oidcRpClientId: "ITTIS"
  adminUsername: "admin_omcm"
  adminEmail: "itqos_support.omcm@orange.com"
  agentUsername: "agent_omcm"
  agentEmail: "itqos_support.omcm@orange.com"

# ── Stockage ──────────────────────────────────────────────────────────────────
storage:
  storageClassName: crc-csi-hostpath-provisioner
  mediaSize: 5Gi
