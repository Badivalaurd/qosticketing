apiVersion: apps/v1
kind: Deployment
metadata:
  name: ittis-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ittis-redis
  template:
    metadata:
      labels:
        app: ittis-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ittis-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: redis
spec:
  selector:
    app: ittis-redis
  ports:
    - port: 6379
      targetPort: 6379
