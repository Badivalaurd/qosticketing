apiVersion: v1
kind: Secret
metadata:
  name: ittis-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ittis
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secret.secretKey | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  OIDC_RP_CLIENT_SECRET: {{ .Values.secret.oidcClientSecret | quote }}
  EMAIL_HOST_USER: {{ .Values.secret.emailHostUser | quote }}
  EMAIL_HOST_PASSWORD: {{ .Values.secret.emailHostPassword | quote }}
  ADMIN_PASSWORD: {{ .Values.secret.adminPassword | quote }}
  AGENT_PASSWORD: {{ .Values.secret.agentPassword | quote }}
