apiVersion: apps/v1
kind: Deployment
metadata:
  name: ittis-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ittis-web
  template:
    metadata:
      labels:
        app: ittis-web
    spec:
      initContainers:
        - name: migrate
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              python manage.py migrate --noinput &&
              python manage.py init_prod
          envFrom:
            - configMapRef:
                name: ittis-config
            - secretRef:
                name: ittis-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      containers:
        - name: web
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ittis-config
            - secretRef:
                name: ittis-secret
          volumeMounts:
            - name: media
              mountPath: /app/media
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: ittis-media
---
apiVersion: v1
kind: Service
metadata:
  name: ittis-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: web
spec:
  selector:
    app: ittis-web
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ittis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ittis
    app.kubernetes.io/component: route
spec:
  to:
    kind: Service
    name: ittis-web
    weight: 100
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
